name: Collar Eval (full pipeline)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (48 = 2 gün)"
        required: false
        default: "48"
      sample_rate:
        description: "Örneklem oranı (0.03 = %3)"
        required: false
        default: "0.03"
      delay_sec:
        description: "T+3dk bekleme (saniye). 180 = gerçek koşu, 0 = SMOKE (yayınlanmaz)"
        required: false
        default: "180"
      concurrency:
        description: "Paralel havuz sayısı"
        required: false
        default: "3"

  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: collar-eval
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
  ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
  EXPECTED_CHAIN_ID: "4663"
  COLLAR_MCP_URL: "https://api.collarguardrail.com/mcp-http/mcp"
  SWAP_TOPIC: "0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HAS_R2: ${{ secrets.R2_ENDPOINT != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours || '48' }}
          SAMPLE_RATE: ${{ inputs.sample_rate || '0.03' }}
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }}
        run: |
          python - <<'PY'
          import os, sys
          try:
              h = int(os.environ["BACKFILL_HOURS"])
              r = float(os.environ["SAMPLE_RATE"])
              d = int(os.environ["DELAY_SEC"])
              c = int(os.environ["CONCURRENCY"])
          except ValueError as e:
              sys.exit(f"Geçersiz input: {e}")
          if not (1 <= h <= 720): sys.exit("backfill_hours 1-720")
          if not (0 < r <= 1): sys.exit("sample_rate (0,1]")
          if not (0 <= d <= 600): sys.exit("delay_sec 0-600")
          if not (1 <= c <= 5): sys.exit("concurrency 1-5")
          print(f"OK: backfill={h}h, sample={r:.2%}, delay={d}s, concurrency={c}")
          PY

      - name: Fetch historical data (for cumulative outcomes)
        env:
          DATA_DIR: publish-data
          DATA_BRANCH: live-data
        run: |
          source .github/scripts/databranch.sh
          setup_data_branch
          
          if [ -f "$DATA_DIR/evaluations.jsonl" ]; then
            cp "$DATA_DIR/evaluations.jsonl" .
            echo "✓ evaluations.jsonl yüklendi."
          fi
          if [ -f "$DATA_DIR/events.jsonl" ]; then
            mkdir -p data
            cp "$DATA_DIR/events.jsonl" data/
            echo "✓ events.jsonl yüklendi."
          fi
          if [ -f "$DATA_DIR/outcomes.jsonl" ]; then
            cp "$DATA_DIR/outcomes.jsonl" .
            echo "✓ outcomes.jsonl yüklendi."
          fi
          
          git worktree remove "$DATA_DIR" --force || rm -rf "$DATA_DIR"
          git worktree prune

      - name: Restore scan state
        uses: actions/cache/restore@v4
        with:
          path: outcomes-state.json
          key: outcomes-state-v1
          restore-keys: |
            outcomes-state-

      - name: Collar preflight
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio, sys, httpx
          from collar_watch import collar as C
          async def main():
              async with httpx.AsyncClient(timeout=C.TIMEOUT_SEC) as client:
                  schema, err = await C.preflight(client, None)
                  if err:
                      sys.exit(f"Collar preflight başarısız: {err}")
          asyncio.run(main())
          PY
          sleep 10

      - name: Backfill (48h)
        timeout-minutes: 20
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours || '48' }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
        run: python -m collar_watch.counter

      - name: Sample
        timeout-minutes: 5
        env:
          SAMPLE_RATE: ${{ inputs.sample_rate || '0.03' }}
          SEED: "42"
        run: python -m collar_watch.sampler

      - name: Verify sample
        run: |
          wc -l sampled-pools.jsonl
          zero_count=$(grep -c '"token": "0x0000000000000000000000000000000000000000"' sampled-pools.jsonl || true)
          echo "ZERO token: $zero_count"
          if [ "$zero_count" -gt 0 ]; then exit 1; fi
          if [ ! -s sample-meta.json ]; then exit 1; fi

      # v0.7.3: timeout 170dk (139 havuz × 180s / 3 concurrency ≈ 139 dk, +30dk marj)
      - name: Evaluate with Collar
        timeout-minutes: 170
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }}
          REQ_PER_MIN: "8"
        run: python -m collar_watch.collar

      - name: Track 24h Outcomes (Cumulative)
        timeout-minutes: 60
        env:
          RPC_URL: ${{ env.ROBINHOOD_RPC }}
          POOL_MANAGER: ${{ env.POOL_MANAGER }}
          SWAP_TOPIC: ${{ env.SWAP_TOPIC }}
          OUTCOMES_OUT: "outcomes.json"
          OUTCOMES_OUT_JSONL: "outcomes.jsonl"
          STATE_FILE: "outcomes-state.json"
          RPC_RPS: "3"
          START_RANGE: "2000"
          MIN_RANGE: "200"
          LOOKBACK_HOURS: "24"
          POOL_BATCH: "50"
          TIME_BUDGET_SEC: "3000"
          COOLDOWN_EVERY: "100"
          COOLDOWN_SEC: "15"
        run: python -m collar_watch.outcomes

      - name: Save scan state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outcomes-state.json
          key: outcomes-state-v1

      - name: Build UI JSON
        if: success()
        env:
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
        run: python -m collar_watch.publish

      - name: Push to live-data
        if: success() && fromJSON(inputs.delay_sec || '180') >= 150
        env:
          DATA_DIR: publish-data
          DATA_BRANCH: live-data
        run: |
          source .github/scripts/databranch.sh
          setup_data_branch
          cp scorecard.json "$DATA_DIR/" 2>/dev/null || true
          cp recent.json "$DATA_DIR/" 2>/dev/null || true
          cp outcomes.json "$DATA_DIR/" 2>/dev/null || true
          cp evaluations.jsonl "$DATA_DIR/" 2>/dev/null || true
          cp outcomes.jsonl "$DATA_DIR/" 2>/dev/null || true
          mkdir -p "$DATA_DIR/data"
          cp data/events.jsonl "$DATA_DIR/data/" 2>/dev/null || true
          commit_push scorecard.json recent.json outcomes.json evaluations.jsonl outcomes.jsonl data/events.jsonl
          echo "✓ live-data push edildi"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collar-eval
          retention-days: 14
          path: |
            evaluations.jsonl
            outcomes.json
            outcomes.jsonl
            scorecard.json
            recent.json
            outcomes-state.json
            data/events.jsonl