name: Collar Eval (full pipeline)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (48 = 2 gün)"
        required: false
        default: "48"
      sample_rate:
        description: "Örneklem oranı (0.03 = %3)"
        required: false
        default: "0.03"
      delay_sec:
        description: "T+3dk bekleme (saniye). 180 = gerçek koşu, 0 = SMOKE (yayınlanmaz)"
        required: false
        default: "180"
      concurrency:
        description: "Paralel havuz sayısı"
        required: false
        default: "3"  # KRİTİK GÜNCELLEME: 1 yerine 3 (Zaman aşımını önler)

  schedule:
    # New York saatiyle 03:00 (Kış saati: UTC 08:00)
    - cron: '0 8 * * *' 

permissions:
  contents: write

concurrency:
  group: collar-eval
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
  ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
  EXPECTED_CHAIN_ID: "4663"
  COLLAR_MCP_URL: "https://api.collarguardrail.com/mcp-http/mcp"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Tüm işlemlerin rahatça bitmesi için 3 saate çıkarıldı
    env:
      HAS_R2: ${{ secrets.R2_ENDPOINT != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours || '48' }}
          SAMPLE_RATE: ${{ inputs.sample_rate || '0.03' }}
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }} # Güncellendi
        run: |
          python - <<'PY'
          import os, sys
          try:
              h = int(os.environ["BACKFILL_HOURS"])
              r = float(os.environ["SAMPLE_RATE"])
              d = int(os.environ["DELAY_SEC"])
              c = int(os.environ["CONCURRENCY"])
          except ValueError as e:
              sys.exit(f"Geçersiz input: {e}")
          if not (1 <= h <= 720): sys.exit("backfill_hours 1-720")
          if not (0 < r <= 1): sys.exit("sample_rate (0,1]")
          if not (0 <= d <= 600): sys.exit("delay_sec 0-600")
          if not (1 <= c <= 5): sys.exit("concurrency 1-5")
          print(f"OK: backfill={h}h, sample={r:.2%}, delay={d}s, concurrency={c}")
          PY

      # 1. GEÇMİŞ VERİYİ YÜKLE (24 SAATLİK ANALİZ İÇİN)
      - name: Fetch historical data (for 24h outcomes)
        env:
          DATA_DIR: publish-data
          DATA_BRANCH: live-data
        run: |
          source .github/scripts/databranch.sh
          setup_data_branch
          
          if [ -f "$DATA_DIR/evaluations.jsonl" ]; then
            cp "$DATA_DIR/evaluations.jsonl" .
            echo "Geçmiş değerlendirmeler yüklendi."
          fi
          if [ -f "$DATA_DIR/events.jsonl" ]; then
            mkdir -p data
            cp "$DATA_DIR/events.jsonl" data/
            echo "Geçmiş havuz verileri yüklendi."
          fi
          
          # KRİTİK: Sonraki adım çakışmasın diye worktree'yi temizle
          git worktree remove "$DATA_DIR" --force || rm -rf "$DATA_DIR"
          git worktree prune

      - name: Collar preflight (erken kontrol)
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio, sys, httpx
          from collar_watch import collar as C
          async def main():
              async with httpx.AsyncClient(timeout=C.TIMEOUT_SEC) as client:
                  schema, err = await C.preflight(client, None)
                  if err:
                      sys.exit(f"Collar preflight başarısız: {err}")
          asyncio.run(main())
          PY
          sleep 10

      - name: Backfill (48h)
        timeout-minutes: 20
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours || '48' }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
        run: python -m collar_watch.counter

      - name: Sample
        timeout-minutes: 5
        env:
          SAMPLE_RATE: ${{ inputs.sample_rate || '0.03' }}
          SEED: "42"
        run: python -m collar_watch.sampler

      - name: Verify sample (ZERO + meta kontrolü)
        run: |
          echo "=== satır sayısı ==="
          wc -l sampled-pools.jsonl
          echo ""
          zero_count=$(grep -c '"token": "0x0000000000000000000000000000000000000000"' sampled-pools.jsonl || true)
          echo "=== ZERO token sayısı (0 olmalı): $zero_count ==="
          echo ""
          if [ "$zero_count" -gt 0 ]; then
            echo "::error::$zero_count ZERO token var. Sampler quote/token ayrımı bozuk; Collar'a gitmeden duruyorum."
            exit 1
          fi
          if [ ! -s sample-meta.json ]; then
            echo "::error::sample-meta.json yok. sampler.py toplam havuz sayısını (payda) yazmıyor; sample_rate yanlış çıkar."
            exit 1
          fi

      # 2. COLLAR DEĞERLENDİRMESİ
      - name: Evaluate with Collar
        timeout-minutes: 120 # Artırıldı (100 -> 120)
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }} # Güncellendi
          REQ_PER_MIN: "8"
        run: python -m collar_watch.collar

      # 3. 24 SAATLİK SONUÇLARI HESAPLA (Geçmiş + Bugün)
      - name: Track 24h Outcomes (LP Pulls + Anomalies)
        timeout-minutes: 30
        env:
          RPC_URL: ${{ env.ROBINHOOD_RPC }}
          POOL_MANAGER: ${{ env.POOL_MANAGER }}
          OUTCOMES_OUT: "outcomes.json"
          OUTCOMES_OUT_JSONL: "outcomes.jsonl"
          RPC_RPS: "2"           # 429'u önlemek için saniyede 2 istek
          START_RANGE: "10000"
          MIN_RANGE: "500"
        run: python -m collar_watch.outcomes

      - name: Build UI JSON (sanity gate)
        if: success()
        env:
          DELAY_SEC: ${{ inputs.delay_sec || '180' }}
        run: python -m collar_watch.publish

      # 4. YAYINLAMA (Geçmişi ve bugünü kaydet)
      - name: Push to live-data (public fallback)
        if: success() && fromJSON(inputs.delay_sec || '180') >= 150
        env:
          DATA_DIR: publish-data
          DATA_BRANCH: live-data
        run: |
          source .github/scripts/databranch.sh
          setup_data_branch
          
          cp scorecard.json "$DATA_DIR/" 2>/dev/null || true
          cp recent.json "$DATA_DIR/" 2>/dev/null || true
          cp outcomes.json "$DATA_DIR/" 2>/dev/null || true
          cp evaluations.jsonl "$DATA_DIR/" 2>/dev/null || true
          
          mkdir -p "$DATA_DIR/data"
          cp data/events.jsonl "$DATA_DIR/data/" 2>/dev/null || true
          
          commit_push scorecard.json recent.json outcomes.json evaluations.jsonl data/events.jsonl
          echo "✓ live-data branch'ine push edildi"

      - name: Publish to R2
        if: success() && env.HAS_R2 == 'true' && fromJSON(inputs.delay_sec || '180') >= 150
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install awscli
          aws s3 cp recent.json s3://collar-data/recent.json --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=300" --content-type "application/json"
          aws s3 cp scorecard.json s3://collar-data/scorecard.json --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=300" --content-type "application/json"
          aws s3 cp outcomes.json s3://collar-data/outcomes.json --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=300" --content-type "application/json"
          echo "✓ R2'ye yayınlandı"

      - name: Publish atlandı (bilgi)
        if: success() && !(env.HAS_R2 == 'true' && fromJSON(inputs.delay_sec || '180') >= 150)
        run: echo "::notice::R2 yayını atlandı. live-data push yine de çalıştı."

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collar-eval
          retention-days: 14
          if-no-files-found: warn
          path: |
            evaluations.jsonl
            outcomes.json
            outcomes.jsonl
            sampled-pools.jsonl
            sample-meta.json
            scorecard.json
            recent.json
            counter-summary.json
            counter.log
            data/events.jsonl