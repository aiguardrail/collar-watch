name: Collar Eval (full pipeline)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (48 = 2 gün)"
        required: false
        default: "48"
      sample_rate:
        description: "Örneklem oranı (0.03 = %3)"
        required: false
        default: "0.03"
      delay_sec:
        description: "T+3dk bekleme (saniye). 180 = gerçek koşu, 0 = SMOKE (yayınlanmaz)"
        required: false
        default: "180"
      concurrency:
        description: "Paralel havuz sayısı"
        required: false
        default: "5"

permissions:
  contents: write   # live-data branch'ine push için gerekli

concurrency:
  group: collar-eval
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
  ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
  EXPECTED_CHAIN_ID: "4663"
  COLLAR_MCP_URL: "https://api.collarguardrail.com/mcp-http/mcp"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Secret'lar step "if" içinde doğrudan okunamaz; job env üzerinden bayrak
      HAS_R2: ${{ secrets.R2_ENDPOINT != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          DELAY_SEC: ${{ inputs.delay_sec }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          python - <<'PY'
          import os, sys
          try:
              h = int(os.environ["BACKFILL_HOURS"])
              r = float(os.environ["SAMPLE_RATE"])
              d = int(os.environ["DELAY_SEC"])
              c = int(os.environ["CONCURRENCY"])
          except ValueError as e:
              sys.exit(f"Geçersiz input: {e}")
          if not (1 <= h <= 720): sys.exit("backfill_hours 1-720")
          if not (0 < r <= 1): sys.exit("sample_rate (0,1]")
          if not (0 <= d <= 600): sys.exit("delay_sec 0-600")
          if not (1 <= c <= 50): sys.exit("concurrency 1-50")
          print(f"OK: backfill={h}h, sample={r:.2%}, delay={d}s, concurrency={c}")
          if d < 150:
              print("::warning::delay_sec < 150: bu koşu 'T+3dk' ölçmez (SMOKE). Yayınlanmayacak.")
          PY

      # Collar erişilemiyorsa/auth bozuksa 12 dk backfill'den ÖNCE öğren
      - name: Collar preflight (erken kontrol)
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio, sys, httpx
          from collar_watch import collar as C

          async def main():
              async with httpx.AsyncClient(timeout=C.TIMEOUT_SEC) as client:
                  schema, err = await C.preflight(client, None)
                  if err:
                      sys.exit(f"Collar preflight başarısız: {err}")
          asyncio.run(main())
          PY

      - name: Backfill (48h)
        timeout-minutes: 20
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
        run: python -m collar_watch.counter

      - name: Sample
        timeout-minutes: 5
        env:
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          SEED: "42"
        run: python -m collar_watch.sampler

      # Collar aşamasına (30+ dk) girmeden önce örneklemi doğrula
      - name: Verify sample (ZERO + meta kontrolü)
        run: |
          echo "=== satır sayısı ==="
          wc -l sampled-pools.jsonl
          echo ""
          zero_count=$(grep -c '"token": "0x0000000000000000000000000000000000000000"' sampled-pools.jsonl || true)
          echo "=== ZERO token sayısı (0 olmalı): $zero_count ==="
          echo ""
          echo "=== ilk 2 satır ==="
          head -2 sampled-pools.jsonl
          if [ "$zero_count" -gt 0 ]; then
            echo "::error::$zero_count ZERO token var. Sampler quote/token ayrımı bozuk; Collar'a gitmeden duruyorum."
            exit 1
          fi
          if [ ! -s sample-meta.json ]; then
            echo "::error::sample-meta.json yok. sampler.py toplam havuz sayısını (payda) yazmıyor; sample_rate yanlış çıkar."
            exit 1
          fi
          echo ""
          echo "=== sample-meta.json ==="
          cat sample-meta.json

      - name: Evaluate with Collar
        timeout-minutes: 60
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
          DELAY_SEC: ${{ inputs.delay_sec }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: python -m collar_watch.collar

      - name: Build UI JSON (sanity gate)
        if: success()
        env:
          DELAY_SEC: ${{ inputs.delay_sec }}
        run: python -m collar_watch.publish

      # YENİ: live-data branch'ine push — scorecard.html'in okuduğu public kaynak.
      # R2'den bağımsız çalışır, R2 secret'ı olmasa bile dosyalar yayınlanır.
      - name: Push to live-data (public fallback)
        if: success() && fromJSON(inputs.delay_sec) >= 150
        env:
          # 'data/' backfill tarafından zaten kullanılıyor; çakışmasın diye ayrı dizin
          DATA_DIR: publish-data
          DATA_BRANCH: live-data
        run: |
          source .github/scripts/databranch.sh
          setup_data_branch
          cp scorecard.json "$DATA_DIR/" 2>/dev/null || true
          cp recent.json "$DATA_DIR/" 2>/dev/null || true
          commit_push scorecard.json recent.json
          echo "✓ live-data branch'ine push edildi"

      # Smoke koşusu (delay<150) ya da R2 kurulu değilse yayın atlanır:
      # yanlışlıkla canlı scorecard.json'ı çöp veriyle ezmesin.
      - name: Publish to R2
        if: success() && env.HAS_R2 == 'true' && fromJSON(inputs.delay_sec) >= 150
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          AWS_DEFAULT_REGION: auto
          # R2, yeni awscli'nin varsayılan checksum başlıklarını reddedebilir
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install awscli
          aws s3 cp recent.json s3://collar-data/recent.json \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type "application/json"
          aws s3 cp scorecard.json s3://collar-data/scorecard.json \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type "application/json"
          echo "✓ R2'ye yayınlandı"

      - name: Publish atlandı (bilgi)
        if: success() && !(env.HAS_R2 == 'true' && fromJSON(inputs.delay_sec) >= 150)
        run: echo "::notice::R2 yayını atlandı (R2 secret yok ya da delay_sec < 150). live-data push yine de çalıştı."

      - name: Show result
        if: always()
        run: |
          {
            echo "### Collar Eval sonucu"
            echo ""
            if [ -f evaluations.jsonl ]; then
              echo "Değerlendirilen havuz: **$(wc -l < evaluations.jsonl)**"
              echo ""
              echo "#### İlk 3 değerlendirme"
              echo '```json'
              head -3 evaluations.jsonl
              echo '```'
            else
              echo "❌ evaluations.jsonl yok"
            fi
            echo ""
            if [ -f scorecard.json ]; then
              echo "#### Scorecard özeti"
              echo '```json'
              head -40 scorecard.json
              echo '```'
            fi
            echo ""
            if [ -f counter-summary.json ]; then
              echo "<details><summary>counter-summary.json</summary>"
              echo ""
              echo '```json'
              head -30 counter-summary.json
              echo '```'
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Yayından önce göz ucuyla bak: gerçek T+3dk gecikmesi ve hook yoğunluğu
      - name: Gap + hook özeti
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, os, statistics
          p = "evaluations.jsonl"
          if not os.path.exists(p):
              raise SystemExit(0)
          rows = [json.loads(l) for l in open(p) if l.strip()]
          gaps = [r["t3m_gap_sec"] for r in rows if r.get("t3m_gap_sec") is not None]
          hooks = collections.Counter(str(r.get("hook")) for r in rows)
          print("#### Gap + hook")
          if gaps:
              print(f"- T+3dk gap: median={statistics.median(gaps):.0f}s "
                    f"min={min(gaps)}s max={max(gaps)}s (n={len(gaps)})")
          for h, c in hooks.most_common(5):
              print(f"- hook {h}: {c} ({c / len(rows):.0%})")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collar-eval
          retention-days: 14
          if-no-files-found: warn
          path: |
            evaluations.jsonl
            sampled-pools.jsonl
            sample-meta.json
            scorecard.json
            recent.json
            counter-summary.json
            counter.log
            data/events.jsonl
