name: Collar Evaluation

on:
  workflow_dispatch:
    inputs:
      delay_sec:
        description: "T+3dk bekleme (saniye)"
        required: false
        default: "180"
      concurrency:
        description: "Paralel havuz"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: Restore sampled-pools
        uses: actions/cache@v4
        with:
          path: data/sampled-pools.jsonl
          key: sampled-pools-48-0.03-42

      - name: Verify sampled-pools
        run: |
          ls -la data/ || true
          wc -l data/sampled-pools.jsonl 2>/dev/null || echo "sampled-pools yok!"
          exit 1  # placeholder — aşağıdaki adımı görene kadar

      # Yukarıdaki verify adımı geçici — aşağıdaki taslağı kullan:

