name: Collar Eval (full pipeline)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (48 = 2 gün)"
        required: false
        default: "48"
      sample_rate:
        description: "Örneklem oranı (0.03 = %3)"
        required: false
        default: "0.03"
      delay_sec:
        description: "T+3dk bekleme (saniye, 0 = hızlı test, 180 = tam 3dk)"
        required: false
        default: "120"
      concurrency:
        description: "Paralel havuz sayısı"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: collar-eval
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
  ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
  EXPECTED_CHAIN_ID: "4663"
  COLLAR_MCP_URL: "https://api.collarguardrail.com/mcp-http/mcp"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          DELAY_SEC: ${{ inputs.delay_sec }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          python - <<'PY'
          import os, sys
          try:
              h = int(os.environ["BACKFILL_HOURS"])
              r = float(os.environ["SAMPLE_RATE"])
              d = int(os.environ["DELAY_SEC"])
              c = int(os.environ["CONCURRENCY"])
          except ValueError as e:
              sys.exit(f"Geçersiz input: {e}")
          if not (1 <= h <= 720): sys.exit("backfill_hours 1-720")
          if not (0 < r <= 1): sys.exit("sample_rate (0,1]")
          if not (0 <= d <= 600): sys.exit("delay_sec 0-600")
          if not (1 <= c <= 50): sys.exit("concurrency 1-50")
          print(f"OK: backfill={h}h, sample={r:.2%}, delay={d}s, concurrency={c}")
          PY

      - name: Backfill (48h)
        timeout-minutes: 20
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
        run: python -m collar_watch.counter

      - name: Sample
        timeout-minutes: 5
        env:
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          SEED: "42"
        run: python -m collar_watch.sampler

      - name: Verify sample (ZERO kontrolü)
        run: |
          echo "=== satır sayısı ==="
          wc -l sampled-pools.jsonl || true
          echo ""
          echo "=== ZERO token sayısı (0 olmalı) ==="
          zero_count=$(grep -c '"token": "0x0000000000000000000000000000000000000000"' sampled-pools.jsonl 2>/dev/null || echo "0")
          echo "$zero_count"
          if [ "$zero_count" -gt 0 ]; then
            echo "⚠️  UYARI: $zero_count ZERO token var — sampler fix'i kontrol et"
          fi
          echo ""
          echo "=== ilk 2 satır ==="
          head -2 sampled-pools.jsonl || true

      - name: Evaluate with Collar
        timeout-minutes: 60
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
          DELAY_SEC: ${{ inputs.delay_sec }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: python -m collar_watch.collar

      - name: Build UI JSON (sanity gate)
        if: success()
        run: python -m collar_watch.publish

      - name: Publish to R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install awscli
          aws s3 cp recent.json s3://collar-data/recent.json \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type "application/json"
          aws s3 cp scorecard.json s3://collar-data/scorecard.json \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type "application/json"
          echo "✓ R2'ye yayınlandı"

      - name: Show result
        if: always()
        run: |
          {
            echo "### Collar Eval sonucu"
            echo ""
            if [ -f evaluations.jsonl ]; then
              echo "Değerlendirilen havuz: **$(wc -l < evaluations.jsonl)**"
              echo ""
              echo "#### İlk 3 değerlendirme"
              echo '```json'
              head -3 evaluations.jsonl
              echo '```'
            else
              echo "❌ evaluations.jsonl yok"
            fi
            echo ""
            if [ -f scorecard.json ]; then
              echo "#### Scorecard özeti"
              echo '```json'
              head -40 scorecard.json
              echo '```'
            fi
            echo ""
            if [ -f counter-summary.json ]; then
              echo "<details><summary>counter-summary.json</summary>"
              echo ""
              echo '```json'
              head -30 counter-summary.json
              echo '```'
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collar-eval
          retention-days: 14
          if-no-files-found: warn
          path: |
            evaluations.jsonl
            sampled-pools.jsonl
            scorecard.json
            recent.json
            counter-summary.json
            counter.log
            data/events.jsonl
