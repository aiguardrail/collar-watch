name: Counter Backfill (7d)

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (168 = 7 gün, 48 = 2 gün)"
        required: false
        default: "168"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Backfill
        env:
          POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
          ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
          EXPECTED_CHAIN_ID: "4663"
        run: python -m collar_watch.counter

      - name: Show summary
        if: always()
        run: |
          echo "=== counter-summary.json ==="
          cat counter-summary.json || echo "(yok)"
          echo ""
          echo "=== data/ satır sayıları ==="
          wc -l data/*.jsonl 2>/dev/null || echo "(yok)"
          echo ""
          echo "=== son 30 log ==="
          tail -30 counter.log || echo "(yok)"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-backfill
          path: |
            counter.log
            counter-summary.json
            data/
