name: Counter Test (3 min)

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run counter (3 min, discovery mode)
        env:
          POOL_MANAGER: ""
          DURATION_HOURS: "0.05"
          ROBINHOOD_WSS: "wss://feed.mainnet.chain.robinhood.com"
          ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
        run: |
          python -m collar_watch.counter

      - name: Show summary
        if: always()
        run: |
          echo "=== counter-summary.json ==="
          cat counter-summary.json || echo "(yok)"
          echo ""
          echo "=== counter.log (ilk 15) ==="
          head -15 counter.log || echo "(yok)"
          echo ""
          echo "=== counter.log (son 15) ==="
          tail -15 counter.log || echo "(yok)"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-result
          path: |
            counter.log
            counter-summary.json
