name: Live T24h

# Saatlik: T0'dan 24 saat geçmiş havuzları Collar'a tekrar sorar.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: live-t24h
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_DIR: data

jobs:
  t24h:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Run T24h
        env:
          COLLAR_API_KEY: ${{ secrets.COLLAR_API_KEY }}
          REQ_PER_MIN: "10"
        run: |
          source .github/scripts/databranch.sh

          # live-data branch'i henüz yoksa yapacak iş yok
          if ! git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            echo "live-data branch'i yok, çıkıyorum."
            exit 0
          fi
          setup_data_branch

          export LIVE_EVENTS="$PWD/$DATA_DIR/live-events.jsonl"
          export T24H_EVENTS="$PWD/$DATA_DIR/t24h-events.jsonl"

          # Kısmi sonuç da geçerli (havuz başına idempotent): hata olsa bile commit'le
          rc=0
          python -u -m collar_watch.t24h || rc=$?
          commit_push t24h-events.jsonl
          exit $rc
