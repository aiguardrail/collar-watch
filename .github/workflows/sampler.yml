name: Sample Pools

on:
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: "Backfill saat (48 = 2 gün)"
        required: false
        default: "48"
      sample_rate:
        description: "Örneklem oranı (0.015 = %1.5)"
        required: false
        default: "0.015"
      seed:
        description: "Rastgelelik tohumu"
        required: false
        default: "42"
      skip_backfill:
        description: "Cache'teki events.jsonl varsa backfill'i atla"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sample-pools
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  POOL_MANAGER: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
  ROBINHOOD_RPC: "https://rpc.mainnet.chain.robinhood.com"
  EXPECTED_CHAIN_ID: "4663"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate inputs
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          SEED: ${{ inputs.seed }}
        run: |
          python - <<'PY'
          import os, sys
          try:
              h = int(os.environ["BACKFILL_HOURS"])
              r = float(os.environ["SAMPLE_RATE"])
              int(os.environ["SEED"])
          except ValueError as e:
              sys.exit(f"Geçersiz input: {e}")
          if not (1 <= h <= 720):
              sys.exit("backfill_hours 1-720 arasında olmalı")
          if not (0 < r <= 1):
              sys.exit("sample_rate (0, 1] aralığında olmalı")
          PY

      - name: Restore events cache
        id: events-cache
        uses: actions/cache@v4
        with:
          path: data/events.jsonl
          key: events-${{ inputs.backfill_hours }}-${{ github.run_id }}
          restore-keys: |
            events-${{ inputs.backfill_hours }}-

      - name: Backfill
        if: ${{ !(inputs.skip_backfill && steps.events-cache.outputs.cache-matched-key != '') }}
        timeout-minutes: 75
        env:
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
          DURATION_HOURS: "0"
          TRACK_LIQUIDITY: "0"
          RPC_RPS: "5"
          BATCH_SIZE: "25"
          MAX_BLOCK_RANGE: "5000"
          TS_PREFETCH_CONCURRENCY: "1"
        run: python -m collar_watch.counter

      - name: Sample
        timeout-minutes: 10
        env:
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          SEED: ${{ inputs.seed }}
        run: python -m collar_watch.sampler

      - name: Show result
        if: always()
        run: |
          {
            echo "### Sample Pools sonucu"
            echo ""
            if [ -f sampled-pools.jsonl ]; then
              echo "Toplam örneklenen pool: **$(wc -l < sampled-pools.jsonl)**"
              echo ""
              echo '```json'
              head -5 sampled-pools.jsonl
              echo '```'
            else
              echo "sampled-pools.jsonl yok"
            fi
            echo ""
            if [ -f counter-summary.json ]; then
              echo "<details><summary>counter-summary.json</summary>"
              echo ""
              echo '```json'
              head -50 counter-summary.json
              echo '```'
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampled-pools
          retention-days: 14
          if-no-files-found: warn
          path: |
            sampled-pools.jsonl
            counter-summary.json
            counter.log
            data/events.jsonl
