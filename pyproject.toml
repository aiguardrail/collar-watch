[project]
name = "collar-watch"
version = "0.1.0"
description = "Watches new Uniswap V4 pools on Robinhood Chain and evaluates them with Collar Guardrail."
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "eth-utils>=4.0",
    "python-dotenv>=1.0",
]

[project.scripts]
collar-counter = "collar_watch.counter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
